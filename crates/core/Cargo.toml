[package]
name = "yahtzee-core"
version = "0.1.0"
authors = ["Jonathan Stites <mail@jonstites.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
ndarray = { version = "0.16", features = ["serde", "rayon"] }
rayon = "1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "recommend"
harness = false
proptest = "1"
