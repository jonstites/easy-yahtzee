[package]
name = "yahtzee-cli"
version = "0.1.0"
authors = ["Jonathan Stites <mail@jonstites.com>"]
edition = "2021"

[[bin]]
name = "easy-yahtzee"
path = "src/main.rs"

[dependencies]
yahtzee-core = { path = "../core" }
anyhow = "1"
bincode = "1.3"
brotli = "6"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
