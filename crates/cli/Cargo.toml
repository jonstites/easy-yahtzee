[package]
name = "yahtzee-cli"
version = "0.1.0"
authors = ["Jonathan Stites <mail@jonstites.com>"]
edition = "2024"

[[bin]]
name = "easy-yahtzee"
path = "src/main.rs"

[dependencies]
yahtzee-core = { path = "../core" }
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
brotli = "8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "play_auto"
path = "tests/play_auto.rs"
