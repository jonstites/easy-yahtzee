[package]
name = "yahtzee-wasm"
version = "0.1.0"
authors = ["Jonathan Stites <mail@jonstites.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
yahtzee-core = { path = "../core" }
bincode = { version = "2", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
